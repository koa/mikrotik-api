[package]
name = "mikrotik-api"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.54.1", features = ["net","rt","io-util","macros","sync","time"]}
tokio-stream = "0.1.19"
log = { version = "0.4.35", features = [] }
thiserror = "2.0.21"
encoding_rs = "0.8.44"
